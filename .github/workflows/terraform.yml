name: Project infrastructure validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: ./scripts/check-layout.sh

  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory:
          - dmz/3-domain
          - dmz/8-runway-target
          - dmz/8-forge-desktop
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.17.1'
      - run: terraform fmt -check
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  packer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: images/dev-desktop-win10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-packer@v3
        with:
          version: '1.16.2'
      - run: packer fmt -check .
      # Unauthenticated GitHub API calls of the plugin getter share the runner IP's rate limit.
      - run: packer init .
        env:
          PACKER_GITHUB_API_TOKEN: ${{ github.token }}
      - run: packer validate -var image_version=0.0.0 -var allowed_inbound_ip=127.0.0.1 .
